name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests and schema validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # sim/tests import `polis.sim`, so the checkout lives in a directory named
    # `polis` and its parent (the workspace) is on PYTHONPATH.
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: polis
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: polis/requirements-ci.txt

      - name: Install dependencies
        run: python -m pip install -r polis/requirements-ci.txt

      - name: pytest (sim kernel tests + YAML schema validation)
        run: python -m pytest -rfEsxX polis/sim/tests polis/cli/tests

      - name: industry.schema.json invariants
        if: ${{ !cancelled() }}
        run: python polis/cli/tests/test_industry_schema.py
