---
id: transit-operator
name: Transit Operator
description: Public transport driver or station staff for London's transit network. Stable public-sector wages.

starter_grant_coin: 1500
wages_weekly_coin: 600
employer_institution_template: transit

commerce_role_hints:
  preferred_vendor_categories: [cafe, grocery]
  required_utilities: [transit_weekly]

skills_baseline:
  driving: 55
  customer_service: 40
  safety: 60
  route_knowledge: 50

cognition_routing:
  decision_frequency_wall: every_4h
  event_subscriptions:
    - transfer_offer
    - press_mention
    - employer_event
    - need_threshold

surfaces:
  dashboard:
    metrics:
      - id: route_count
        label: "Active routes"
        icon: map
        source: route_count
      - id: on_time_pct
        label: "On-time %"
        icon: clock
        source: on_time_pct
      - id: shifts_this_week
        label: "Shifts this week"
        icon: calendar
        source: shifts_this_week
    primary_action:
      label: "View depot"
      icon: play
      route: /workplace
    feed_events:
      - employer_event
      - need_threshold
  extra_surfaces:
    - workplace

version: "0.2.0"
