---
id: freelancer
name: Freelancer
description: Self-employed gig worker — delivery, tasking, odd jobs. Variable income, no institution employer.

starter_grant_coin: 800
wages_weekly_coin: 200
employer_institution_template: freelance

commerce_role_hints:
  preferred_vendor_categories: [cafe, grocery]
  required_utilities: [transit_weekly]

skills_baseline:
  hustling: 45
  time_management: 35
  negotiation: 30
  endurance: 40

cognition_routing:
  decision_frequency_wall: every_4h
  event_subscriptions:
    - transfer_offer
    - press_mention
    - need_threshold

surfaces:
  dashboard:
    metrics:
      - id: active_gigs
        label: "Active gigs"
        icon: clipboard
        source: active_gigs
      - id: earnings_7d
        label: "Earnings (7d)"
        icon: coin
        source: earnings_7d
      - id: client_rating
        label: "Client rating"
        icon: star
        source: client_rating
    primary_action:
      label: "Browse gigs"
      icon: search
      route: /gig-board
    feed_events:
      - need_threshold

version: "0.2.0"
