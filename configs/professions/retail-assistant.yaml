---
id: retail-assistant
name: Retail Assistant
description: Shop-floor worker at a grocery or department store. Entry-level with steady hours.

starter_grant_coin: 1200
wages_weekly_coin: 320
employer_institution_template: grocery

commerce_role_hints:
  preferred_vendor_categories: [grocery, cafe]
  required_utilities: [transit_weekly]

skills_baseline:
  customer_service: 45
  cash_handling: 50
  inventory: 30
  endurance: 35

cognition_routing:
  decision_frequency_wall: every_4h
  event_subscriptions:
    - transfer_offer
    - press_mention
    - employer_event
    - need_threshold

surfaces:
  dashboard:
    metrics:
      - id: sales_7d
        label: "Sales (7d)"
        icon: coin
        source: sales_7d
      - id: customer_rating
        label: "Customer rating"
        icon: star
        source: customer_rating
      - id: shifts_this_week
        label: "Shifts this week"
        icon: calendar
        source: shifts_this_week
    primary_action:
      label: "Start shift"
      icon: play
      route: /workplace
    feed_events:
      - employer_event
      - need_threshold
  extra_surfaces:
    - workplace

version: "0.2.0"
