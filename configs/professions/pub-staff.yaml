---
id: pub-staff
name: Pub Staff
description: Bartender or server at a London pub. Social profession with tips.

starter_grant_coin: 1200
wages_weekly_coin: 300
employer_institution_template: pub

commerce_role_hints:
  preferred_vendor_categories: [pub, cafe, grocery]
  required_utilities: [transit_weekly]

skills_baseline:
  customer_service: 50
  cash_handling: 40
  social: 55
  endurance: 35

cognition_routing:
  decision_frequency_wall: every_4h
  event_subscriptions:
    - transfer_offer
    - press_mention
    - employer_event
    - need_threshold

surfaces:
  dashboard:
    metrics:
      - id: regulars_count
        label: "Regular customers"
        icon: users
        source: regulars_count
      - id: tips_7d
        label: "Tips (7d)"
        icon: coin
        source: tips_7d
      - id: shifts_this_week
        label: "Shifts this week"
        icon: calendar
        source: shifts_this_week
    primary_action:
      label: "Start shift"
      icon: play
      route: /workplace
    feed_events:
      - employer_event
      - need_threshold
  extra_surfaces:
    - workplace

version: "0.2.0"
