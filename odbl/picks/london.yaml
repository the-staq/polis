# OSM picks for London: the hand-picked list of public places (L and P tiers)
# that polis names and places from OpenStreetMap. ODbL 1.0, see ../LICENSE.
#
# Each entry is one OSM element, chosen by id on openstreetmap.org. The
# extractor (polis-internal scripts/extract_osm_venues.py) fetches exactly
# these ids, keeps the name and a point, and writes ../london/venues-osm.geojson.
# Nothing here is edited by hand from OSM data: to fix a name, fix it in OSM
# and re-extract (see ../README.md).
#
# Fields:
#   venue_id   our id; joins to seeds/<world>/venues/<district>.yaml (CC BY)
#   osm_type   node | way | relation
#   osm_id     OSM element id
#   tier       L (landmark) or P (public place). V and B are never from OSM.
#   kind       park | pitch | market | station_area | landmark
#   district   polis district slug
#   reason     why this place is in the game
#
# Left out on purpose (2026-10-10): Coram's Fields (a children's site), London
# Stadium (kept as the polis hand label "Olympic Park Stadium", not an OSM
# feature), Stratford Mall and BOXPARK (commercial brands), Homerton
# (twin-place list). "Stratford" is the Stratford area of Newham (Olympic Park,
# the station, West Ham Park), not the whole borough.
#
# Picked 2026-10-10 against OSM base 2026-10-10T00:47Z.

